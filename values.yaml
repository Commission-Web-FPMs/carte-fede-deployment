# The root image and workload settings remain the backend configuration.
image:
  repository: ghcr.io/commission-web-fpms/carte-fede
  pullPolicy: IfNotPresent
  tag: e06aebf80a33905837f3910609f10c1fb48c3a81

replicaCount: 1
containerPort: 8000
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8000

# Application configuration is supplied by the operator, never stored in this chart.
# Supports ordinary env entries, valueFrom and references to existing Secrets/ConfigMaps.
env: []
envFrom: []

resources: {}
startupProbe:
  httpGet:
    path: /api/health
    port: http
  failureThreshold: 30
  periodSeconds: 2
livenessProbe:
  httpGet:
    path: /api/health
    port: http
readinessProbe:
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

frontend:
  image:
    repository: ghcr.io/commission-web-fpms/carte-fede-frontend
    pullPolicy: IfNotPresent
    tag: e06aebf80a33905837f3910609f10c1fb48c3a81
  replicaCount: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  # Public settings only, including FRONTEND_BASE_URL. Do not reuse backend secrets.
  env: []
  envFrom: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  startupProbe:
    httpGet:
      path: /_health
      port: http
    failureThreshold: 30
    periodSeconds: 2
  livenessProbe:
    httpGet:
      path: /_health
      port: http
  readinessProbe:
    httpGet:
      path: /_health
      port: http
    periodSeconds: 5
  nodeSelector: {}
  tolerations: []
  affinity: {}

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: public
      namespace: traefik
      # Omit sectionName to allow the Gateway's matching HTTP/HTTPS listeners.
  hostnames:
    - carte.fede.fpms.ac.be
  # A missing backend field retains the old convention: route to the API.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: Exact
            value: /verify
      backend: backend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backend: frontend

# Requires the Traefik Middleware CRD and kubernetesCRD provider.
# Limits apply per Traefik instance, like the old per-Nginx-instance limits.
rateLimit:
  enabled: true
  # Empty sourceCriterion uses the direct client IP.
  # Set ipStrategy only if Traefik sits behind another trusted proxy.
  sourceCriterion: {}
  registration:
    average: 5
    period: 1m
    burst: 5
  paymentQr:
    average: 10
    period: 1m
    burst: 5
