  annotations: {}
  name: ''
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 8000
env:
- name: APP_ENV
  value: development
- name: AUTH_MODE
  value: oidc
- name: DATABASE_NAME
  value: carte_fede_dev
- name: AUTO_CREATE_DB
  value: '0'
- name: WEB_CONCURRENCY
  value: '1'
- name: SESSION_COOKIE_SECURE
  value: 'true'
- name: REMEMBER_COOKIE_SECURE
  value: 'true'
- name: PROXY_FIX_X_FOR
  value: '2'
- name: PROXY_FIX_X_PROTO
  value: '1'
- name: PROXY_FIX_X_HOST
  value: '1'
- name: PROXY_FIX_X_PORT
  value: '0'
- name: PROXY_FIX_X_PREFIX
  value: '0'
- name: FRONTEND_BASE_URL
  value: https://carte-dev.fede.fpms.ac.be
- name: OIDC_ISSUER_URL
  value: https://auth.fede.fpms.ac.be/application/o/carte-fede-dev/
- name: OIDC_CLIENT_ID
  value: carte-fede-dev
- name: GUNICORN_CMD_ARGS
  value: --access-logformat='%(m)s %(s)s %(L)s'
- name: DEV_DATA_MODE
  value: production_copy
- name: DEV_SESSION_IDLE_SECONDS
  value: '1800'
- name: DEV_SESSION_ABSOLUTE_SECONDS
  value: '28800'
- name: OIDC_PASSWORD_CHANGE_URL
  value: https://auth.fede.fpms.ac.be/if/flow/default-password-change/
- name: DEV_REGISTRATION_ENABLED
  value: '1'
envFrom:
- secretRef:
    name: carte-fede-dev-credentials
- secretRef:
    name: carte-fede-dev-identity-api
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
startupProbe:
  httpGet:
    path: /api/health
    port: http
  failureThreshold: 30
  periodSeconds: 2
livenessProbe:
  httpGet:
    path: /api/health
    port: http
readinessProbe:
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 5
nodeSelector: {}
tolerations: []
affinity: {}
frontend:
  image:
    repository: ghcr.io/commission-web-fpms/carte-fede-dev-frontend
    pullPolicy: IfNotPresent
    tag: 97528d1ccb06fee27bac227e8dd7e8e341c1d035
  replicaCount: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  env: []
  envFrom: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi
  startupProbe:
    httpGet:
      path: /_health
      port: http
    failureThreshold: 30
    periodSeconds: 2
  livenessProbe:
    httpGet:
      path: /_health
      port: http
  readinessProbe:
    httpGet:
      path: /_health
      port: http
    periodSeconds: 5
  nodeSelector: {}
  tolerations: []
  affinity: {}
httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
  - name: public
    namespace: traefik
  hostnames:
  - carte-dev.fede.fpms.ac.be
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: Exact
        value: /verify
    backend: backend
  - matches:
    - path:
        type: PathPrefix
        value: /
    backend: frontend
  filters:
  - type: ExtensionRef
    extensionRef:
      group: traefik.io
      kind: Middleware
      name: carte-fede-npm-only
rateLimit:
  enabled: true
  sourceCriterion:
    ipStrategy:
      depth: 1
  registration:
    average: 5
    period: 1m
    burst: 5
  paymentQr:
    average: 10
    period: 1m
    burst: 5
devInitialization:
  enabled: false
